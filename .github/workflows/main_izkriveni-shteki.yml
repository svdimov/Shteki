# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure App Service: https://aka.ms/python-webapps-actions

name: Build and deploy Python app to Azure Web App - izkriveni-shteki

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (for tests / lint)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Optional: add tests here
      # - name: Run tests
      #   run: python manage.py test

      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            .
            !venv/
            !staticfiles/**
            !.git/**

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_F88ACABACE1B49E8BD9853E4FC12FEE9 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_E7CF368B216E4DA38589FF8323C0B0F3 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_BB7E3EB2D13A432981DF20647B3C803B }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: "izkriveni-shteki"
          slot-name: "Production"

      # ✅ IMPORTANT: run collectstatic on the server AFTER deploy
      - name: Collect static on Azure (post-deploy)
        run: |
          az webapp run-command invoke \
            --resource-group "shteki" \
            --name "izkriveni-shteki" \
            --command-id RunShellScript \
            --scripts "cd /home/site/wwwroot && python manage.py collectstatic --noinput"
